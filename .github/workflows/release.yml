name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build binaries
        run: |
          mkdir -p dist
          go test ./...
          go vet ./...
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/harvester-provider-$os-$arch" ./cmd/harvester-provider
          done
          test "$(python3 -c 'import re; print(re.search(r"^version: (.+)$", open("provider.yaml").read(), re.M)[1])')" = "${GITHUB_REF_NAME#v}"
          cp provider.yaml dist/provider.yaml
          (cd dist && sha256sum harvester-provider-* provider.yaml > checksums.txt)
          (cd dist && sha256sum -c checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/harvester-provider-*
            dist/checksums.txt
            dist/provider.yaml
