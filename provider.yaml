name: harvester
version: 0.1.1
description: Devsy on Harvester

options:
  KUBECONFIG:
    description: Path to the Harvester kubeconfig.
    required: true
  HARVESTER_CONTEXT:
    description: Optional kubeconfig context for the Harvester cluster.
  HARVESTER_NAMESPACE:
    description: Namespace for the VirtualMachine resource.
    default: default
  HARVESTER_IMAGE:
    description: Harvester image name or image reference used for the VM root disk.
    required: true
  HARVESTER_IMAGE_NAMESPACE:
    description: Namespace containing the Harvester image.
    default: harvester-public
  HARVESTER_IMAGE_TYPE:
    description: Image attachment type.
    default: raw
    suggestions: [raw, qcow2, iso]
  HARVESTER_STORAGE_CLASS:
    description: Storage class for the writable root disk when using an ISO image.
  HARVESTER_CPU:
    description: VM CPU cores.
    default: "4"
  HARVESTER_MEMORY:
    description: VM memory request.
    default: 8Gi
  HARVESTER_DISK:
    description: Root disk size.
    default: 40Gi
  HARVESTER_SSH_HOST:
    description: Optional fixed SSH host. If omitted, Devsy discovers the VM IP from Harvester.
  HARVESTER_SSH_USER:
    description: SSH user inside the VM.
    default: ubuntu
  HARVESTER_SSH_PORT:
    description: SSH port inside the VM.
    default: "22"
  HARVESTER_SSH_FLAGS:
    description: Additional SSH flags.
  HARVESTER_SSH_PUBLIC_KEY:
    description: SSH public key to inject through cloud-init.
  HARVESTER_USER_DATA:
    description: Optional complete cloud-init user-data, overriding the generated SSH setup.
    password: true
agent:
  path: /opt/devsy/agent
  driver: docker
  inactivityTimeout: 30m
  exec:
    shutdown: sudo -n shutdown -h now || shutdown -h now
exec:
  init: ${HARVESTER_PROVIDER} init
  command: ${HARVESTER_PROVIDER} command --command "${COMMAND}"
  create: ${HARVESTER_PROVIDER} create
  delete: ${HARVESTER_PROVIDER} delete
  start: ${HARVESTER_PROVIDER} start
  stop: ${HARVESTER_PROVIDER} stop
  status: ${HARVESTER_PROVIDER} status
binaries:
  HARVESTER_PROVIDER:
    - os: linux
      arch: amd64
      path: https://github.com/joshyorko/devsy-provider-harvester/releases/latest/download/harvester-provider-linux-amd64
    - os: linux
      arch: arm64
      path: https://github.com/joshyorko/devsy-provider-harvester/releases/latest/download/harvester-provider-linux-arm64
    - os: darwin
      arch: amd64
      path: https://github.com/joshyorko/devsy-provider-harvester/releases/latest/download/harvester-provider-darwin-amd64
    - os: darwin
      arch: arm64
      path: https://github.com/joshyorko/devsy-provider-harvester/releases/latest/download/harvester-provider-darwin-arm64
